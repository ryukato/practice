spring:
  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 180s
      validation-query: SELECT 1
    properties:
      connectTimeout: PT15S
      ssl: false
      maxCreateConnectionTime: PT3S
      maxAcquireTime: PT10S
      maxLifeTime: PT300S
database:
  dialect: mysql
